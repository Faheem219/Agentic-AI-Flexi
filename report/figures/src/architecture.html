<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veritas architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fff; }
  #fig { width: 1000px; padding: 10px; box-sizing: border-box; }
  text { font-family: "Hanken Grotesk", sans-serif; fill: #18243D; }
  .t { font-size: 19px; font-weight: 700; }
  .s { font-size: 15.5px; fill: #3b4659; }
  .lbl { font-size: 14.5px; fill: #5B6577; }
</style>
</head>
<body>
<div id="fig">
<svg width="980" height="790" viewBox="0 0 980 790" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18243D"/></marker>
  </defs>
  <rect x="10" y="10" width="960" height="104" rx="6" fill="#fff" stroke="#18243D" stroke-width="1.6"/>
  <text x="28" y="40" class="t">Web app: React + Vite + TypeScript, hosted on Vercel</text>
  <text x="28" y="66" class="s">Ask page, live agent-team view, plan editor, catalogue-card citations, library, evaluation page.</text>
  <text x="28" y="90" class="s">Live updates over Server-Sent Events, with automatic fallback to polling.</text>
  <line x1="490" y1="114" x2="490" y2="166" stroke="#18243D" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="502" y="146" class="lbl">HTTPS to the backend domain (VITE_API_BASE, CORS)</text>

  <rect x="10" y="168" width="960" height="420" rx="8" fill="#F2F4F7" stroke="#C5D3EA" stroke-dasharray="6 4"/>
  <text x="26" y="194" class="lbl">Linux VM: Nginx (domain + SSL certificate) forwards to Uvicorn on 127.0.0.1:8000 in tmux (single worker)</text>

  <rect x="30" y="212" width="270" height="140" fill="#fff" stroke="#18243D" stroke-width="1.6"/>
  <text x="46" y="242" class="t">FastAPI + Uvicorn</text>
  <text x="46" y="268" class="s">REST + SSE endpoints</text><text x="46" y="290" class="s">run manager, rate limit,</text><text x="46" y="312" class="s">access code, CORS</text>
  <line x1="300" y1="282" x2="346" y2="282" stroke="#18243D" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="348" y="212" width="602" height="140" rx="14" fill="#fff" stroke="#B8323A" stroke-width="2"/>
  <text x="366" y="242" class="t">LangGraph agent workflow</text>
  <text x="366" y="268" class="s">guardrail, memory, planner, plan review (interrupt / resume),</text>
  <text x="366" y="290" class="s">researchers in parallel (Send), writer, verifier, critic loop,</text>
  <text x="366" y="312" class="s">publisher; every step emits trace events</text>

  <line x1="420" y1="352" x2="200" y2="404" stroke="#18243D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="560" y1="352" x2="510" y2="404" stroke="#18243D" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540" y="386" class="lbl">MCP client (stdio)</text>
  <line x1="820" y1="352" x2="820" y2="404" stroke="#18243D" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="30" y="406" width="270" height="160" fill="#fff" stroke="#18243D" stroke-width="1.6"/>
  <text x="46" y="436" class="t">Gemini gateway</text>
  <text x="46" y="462" class="s">smart / fast model tiers,</text><text x="46" y="484" class="s">fallback chain, cool-down,</text><text x="46" y="506" class="s">retries, response cache,</text><text x="46" y="528" class="s">token accounting</text>

  <rect x="348" y="406" width="300" height="160" rx="14" fill="#fff" stroke="#B8323A" stroke-width="2"/>
  <text x="364" y="436" class="t">MCP tool server (process)</text>
  <text x="364" y="462" class="s">search_openalex (+ Crossref)</text><text x="364" y="484" class="s">search_arxiv</text><text x="364" y="506" class="s">search_wikipedia</text><text x="364" y="528" class="s">search_knowledge_base</text>

  <rect x="680" y="406" width="270" height="160" fill="#fff" stroke="#18243D" stroke-width="1.6"/>
  <text x="696" y="436" class="t">SQLite (WAL)</text>
  <text x="696" y="462" class="s">runs and trace events,</text><text x="696" y="484" class="s">library chunks + vectors,</text><text x="696" y="506" class="s">episodic memory,</text><text x="696" y="528" class="s">LLM and tool caches</text>
  <line x1="648" y1="486" x2="678" y2="486" stroke="#18243D" stroke-width="1.6" marker-end="url(#a)"/>

  <line x1="165" y1="566" x2="165" y2="636" stroke="#18243D" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="498" y1="566" x2="498" y2="636" stroke="#18243D" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="638" width="270" height="130" fill="#fff" stroke="#18243D" stroke-width="1.6"/>
  <text x="46" y="668" class="t">Google Gemini API</text>
  <text x="46" y="694" class="s">free tier: 3.x Flash and</text><text x="46" y="716" class="s">Flash-Lite models,</text><text x="46" y="738" class="s">gemini-embedding-001</text>
  <rect x="348" y="638" width="602" height="130" fill="#fff" stroke="#18243D" stroke-width="1.6"/>
  <text x="364" y="668" class="t">Scholarly data sources (free public APIs)</text>
  <text x="364" y="694" class="s">OpenAlex (250M+ works), Crossref (DOI metadata, fallback and verification),</text>
  <text x="364" y="716" class="s">arXiv (preprints), Wikipedia (background); the user's own uploaded</text>
  <text x="364" y="738" class="s">documents are stored in SQLite and searched with hybrid RAG.</text>
</svg>
</div>
</body>
</html>
